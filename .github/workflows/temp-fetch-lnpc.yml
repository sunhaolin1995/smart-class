name: temp-fetch-lnpc
on:
  push:
    paths:
      - '.github/workflows/temp-fetch-lnpc.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect LNPNC publicity docx
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.lnpc.edu.cn/_upload/article/files/95/f1/9cd3b3144b289ba6efc79818819e/770fc879-32f3-4a74-95f2-fba1ae4ef64f.docx'
          echo "Downloading: $URL"
          python3 - <<'PY'
          import urllib.request, zipfile, re, sys
          from xml.etree import ElementTree as ET
          url='https://www.lnpc.edu.cn/_upload/article/files/95/f1/9cd3b3144b289ba6efc79818819e/770fc879-32f3-4a74-95f2-fba1ae4ef64f.docx'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.lnpc.edu.cn/rsc/2026/0826/c485a48685/page.htm'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data=r.read()
          print('HTTP bytes:', len(data), 'head:', data[:4])
          open('/tmp/lnpc.docx','wb').write(data)
          if not data.startswith(b'PK'):
              print('NOT_A_DOCX')
              sys.exit(2)
          with zipfile.ZipFile('/tmp/lnpc.docx') as z:
              xml=z.read('word/document.xml')
          root=ET.fromstring(xml)
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          paras=[]
          for p in root.findall('.//w:p', ns):
              s=''.join((t.text or '') for t in p.findall('.//w:t',ns)).strip()
              if s: paras.append(s)
          text='\n'.join(paras)
          print('=== DOCUMENT TEXT START ===')
          print(text)
          print('=== DOCUMENT TEXT END ===')
          compact=re.sub(r'\s+','',text)
          for target in ['裴鸿艳','裴红艳']:
              print(f'FOUND {target}:', target in compact)
              if target in compact:
                  i=compact.index(target)
                  print('CONTEXT:', compact[max(0,i-300):i+600])
          PY
